function setRateStar(n){if(!G.rate)return;G.rate.n=n;$$('.rate-stars.big button').forEach((b,k)=>b.setAttribute('aria-pressed',String(k<n)));const b=$('#rsend');if(b)b.disabled=false;SFX.tap()}
async function sendRate(){const R=G.rate;if(!R||!R.n)return;const b=$('#rsend');const x=($('#rtx')||{}).value||'';if(b){b.disabled=true;b.textContent=G.lang==='id'?'Mengirim…':'Sending…'}
  try{const res=await sheetCall({a:'review',lv:R.lv,r:R.n,x,id:uid(),lang:G.lang});if(!res.ok)throw 0;
    SAVE.rated=SAVE.rated||{};SAVE.rated[R.lv]=R.n;persist();closeSheet();toast(G.lang==='id'?'Terima kasih. Ulasanmu sudah terkirim.':'Thank you. Your review was sent.');
    const r=$('.rate');if(r)r.outerHTML=`<p class="fine rate-done">${G.lang==='id'?'Terima kasih atas ulasanmu.':'Thanks for your review.'}</p>`}
  catch(e){if(b){b.disabled=false;b.textContent=G.lang==='id'?'Coba kirim lagi':'Try again'}toast(G.lang==='id'?'Belum terkirim. Periksa koneksi.':'Not sent. Check your connection.')}}
function lbRows(list,me){return list.map((f,k)=>`<div class="${f.me?'me':''}"><span class="rk">${k+1}</span><span>${esc(f.n)}</span><span class="st">${'★'.repeat(f.s)||'0'}</span><span>${fmtSec(f.t)}</span></div>`).join('')}
async function liveBoard(no,stars,time,wrong){
  const box=$('#lb');if(!box)return;const id=G.lang==='id';
  const head=(extra)=>`<h4>${id?'Papan skor hari ini':"Today's leaderboard"}<span>${extra||''}</span></h4>`;
  box.innerHTML=head(id?'memuat…':'loading…');
  try{
    if(SAVE.nick&&!(SAVE.sent||{})[no]){const sr=await sheetCall({a:'score',no,n:SAVE.nick,s:stars,t:time,w:wrong,id:uid(),u:SAVE.acc&&SAVE.acc.u,tok:SAVE.acc&&SAVE.acc.tok});if(sr&&sr.err==='name'&&!SAVE.acc){SAVE.nick='';persist();toast(G.lang==='id'?'Nama itu milik akun lain. Pilih nama lain.':'That name belongs to an account. Pick another.');return liveBoard(no,stars,time,wrong)}SAVE.sent=SAVE.sent||{};SAVE.sent[no]=1;persist()}
    const res=await sheetCall({a:'top',no,id:uid()});if(!$('#lb'))return;
    const list=(res.top||[]).map(f=>Object.assign({},f,{me:SAVE.nick&&f.n===SAVE.nick&&f.mine}));
    let h=head(id?`${res.total||0} pemain`:`${res.total||0} players`)+(list.length?lbRows(list):`<p class="lb-empty">${id?'Belum ada yang masuk papan. Jadilah yang pertama.':'Nobody on the board yet. Be the first.'}</p>`);
    if(res.rank&&res.rank>list.length)h+=`<div class="me"><span class="rk">${res.rank}</span><span>${esc(SAVE.nick)}</span><span class="st">${'★'.repeat(stars)||'0'}</span><span>${fmtSec(time)}</span></div>`;
    if(!SAVE.nick)h+=`<form class="lb-join" data-no="${no}"><label for="nick">${id?'Nama panggilan untuk papan skor':'Nickname for the leaderboard'}</label><div><input id="nick" maxlength="12" autocomplete="nickname" placeholder="${id?'maks. 12 huruf':'max 12 letters'}" required><button class="btn pri" type="submit">${id?'Masuk':'Join'}</button></div><small>${id?'Hanya nama panggilan yang disimpan, bersama skor harianmu.':'Only your nickname is stored, with your daily score.'}</small></form>`;
    box.innerHTML=h;
    const f=box.querySelector('.lb-join');
    if(f)f.addEventListener('submit',ev=>{ev.preventDefault();const v=f.querySelector('input').value.replace(/[^\p{L}\p{N} _.]/gu,'').trim().slice(0,12);if(!v)return;SAVE.nick=v;persist();liveBoard(no,stars,time,wrong)});
  }catch(e){if($('#lb'))box.innerHTML=head(id?'offline':'offline')+`<p class="lb-empty">${id?'Papan skor belum bisa dimuat. Coba lagi nanti.':"Couldn't load the leaderboard. Try again later."}</p>`}
}
const IC_IG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>';
const creditHtml=()=>`<a class="credit" href="${IG_URL}" target="_blank" rel="noopener">${IC_IG}<span>${G.lang==='id'?'Dibuat oleh':'Made by'} @ahmddzul</span></a>`;
const sawHtml=()=>`<a class="saw" href="${SAW_URL}" target="_blank" rel="noopener">${G.lang==='id'?'Dukung di Saweria':'Support on Saweria'}</a>`;
/* ===== Atmosphere: rain + lightning ===== */
const FX={raf:0,on:false,drops:[]};
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(SAVE.fx==null)SAVE.fx=!REDUCE;
const IC_GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" stroke-linecap="round"/></svg>';
const IC_RAIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 15a4.5 4.5 0 0 1 .4-9A6 6 0 0 1 18.6 8 3.5 3.5 0 0 1 18 15H7z"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></svg>';
const IC_CASE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg>';
function windowSvg(){return `<img class="fx-photo" src="assets/p/wp_s1.jpg" alt="">`}
function windowSvgOld(){return `<svg class="fx-win" viewBox="0 0 200 260"><defs><radialGradient id="lamp" cx=".35" cy=".55" r=".7"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".95"/><stop offset=".45" stop-color="#c9893a" stop-opacity=".45"/><stop offset="1" stop-color="#1a1208" stop-opacity="0"/></radialGradient></defs><rect x="8" y="8" width="184" height="244" rx="3" fill="#0b0d12" stroke="#1d2230" stroke-width="10"/><rect x="18" y="18" width="164" height="224" fill="url(#lamp)"/><path d="M18 18h40c-8 60-4 150 6 224H18z" fill="#2a1d14" opacity=".85"/><path d="M182 18h-34c8 60 6 150-4 224h38z" fill="#2a1d14" opacity=".85"/><path d="M100 18v224M18 128h164" stroke="#0b0d12" stroke-width="7"/><ellipse cx="78" cy="168" rx="20" ry="13" fill="#ffe2a3" opacity=".75"/><path d="M70 181h16v30h-16z" fill="#3a2a18" opacity=".8"/></svg>`}
function fxMount(host){
  fxStop();
  const w=document.createElement('div');w.className='fx';w.setAttribute('aria-hidden','true');
  w.innerHTML=`<div class="fx-sky"></div>${windowSvg()}<canvas></canvas><div class="fx-flash"></div>`;
  host.prepend(w);FX.wrap=w;FX.cv=$('canvas',w);FX.c=FX.cv.getContext('2d');
  FX.size=()=>{const r=w.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);FX.w=r.width;FX.h=r.height;FX.cv.width=r.width*d;FX.cv.height=r.height*d;FX.cv.style.width=r.width+'px';FX.cv.style.height=r.height+'px';FX.c.setTransform(d,0,0,d,0,0)};
  FX.size();window.addEventListener('resize',FX.size);
  FX.drops=Array.from({length:150},()=>({x:Math.random()*(FX.w+60),y:Math.random()*FX.h,l:10+Math.random()*20,v:8+Math.random()*8,o:.12+Math.random()*.3}));
  fxDraw(false);if(SAVE.fx)fxStart();
}
function fxDraw(move){const c=FX.c;if(!c)return;c.clearRect(0,0,FX.w,FX.h);c.lineCap='round';c.lineWidth=1;
  for(const d of FX.drops){c.strokeStyle=`rgba(175,195,230,${d.o})`;c.beginPath();c.moveTo(d.x,d.y);c.lineTo(d.x-d.l*.2,d.y+d.l);c.stroke();
    if(move){d.y+=d.v;d.x-=d.v*.2;if(d.y>FX.h){d.y=-24;d.x=Math.random()*(FX.w+60)}}}}
function fxStart(){FX.on=true;cancelAnimationFrame(FX.raf);const loop=()=>{if(!FX.wrap||!document.body.contains(FX.wrap)){fxStop();return}fxDraw(true);FX.raf=requestAnimationFrame(loop)};loop();fxStrikeLater(1300)}
function fxStrikeLater(ms){clearTimeout(FX.st);FX.st=setTimeout(()=>{if(!FX.on)return;fxStrike();fxStrikeLater(7000+Math.random()*9000)},ms)}
function fxStrike(){const w=FX.wrap;if(!w)return;const f=$('.fx-flash',w);f.classList.remove('go');w.classList.remove('lit');void f.offsetWidth;f.classList.add('go');w.classList.add('lit');setTimeout(thunder,450+Math.random()*900)}
function fxStop(){FX.on=false;cancelAnimationFrame(FX.raf);clearTimeout(FX.st);if(FX.size)window.removeEventListener('resize',FX.size)}
let RAIN=null;
function noiseBuf(c,sec){const b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function rainSound(on){
  const c=on?ctx():AC;if(!c)return;
  if(on&&!RAIN){try{
    const g=c.createGain();g.gain.value=0;g.connect(c.destination);
    const hiss=c.createBufferSource();hiss.buffer=noiseBuf(c,3);hiss.loop=true;const hf=c.createBiquadFilter();hf.type='bandpass';hf.frequency.value=2200;hf.Q.value=.4;const hg=c.createGain();hg.gain.value=.9;hiss.connect(hf).connect(hg).connect(g);
    const body=c.createBufferSource();body.buffer=noiseBuf(c,4);body.loop=true;const bf=c.createBiquadFilter();bf.type='lowpass';bf.frequency.value=480;const bg=c.createGain();bg.gain.value=1.3;body.connect(bf).connect(bg).connect(g);
    const sw=c.createOscillator();sw.frequency.value=.13;const swg=c.createGain();swg.gain.value=.25;sw.connect(swg).connect(hg.gain);
    hiss.start();body.start();sw.start();g.gain.linearRampToValueAtTime(.075,c.currentTime+2);
    const drip=()=>{if(!RAIN)return;try{const t0=c.currentTime,o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.setValueAtTime(1800+Math.random()*1600,t0);o.frequency.exponentialRampToValueAtTime(500,t0+.07);og.gain.setValueAtTime(.0001,t0);og.gain.exponentialRampToValueAtTime(.025,t0+.005);og.gain.exponentialRampToValueAtTime(.0001,t0+.09);o.connect(og).connect(c.destination);o.start(t0);o.stop(t0+.1)}catch(e){}RAIN.dt=setTimeout(drip,180+Math.random()*900)};
    RAIN={src:[hiss,body,sw],g};drip()}catch(e){}}
  else if(!on&&RAIN){const n=RAIN;RAIN=null;clearTimeout(n.dt);try{n.g.gain.cancelScheduledValues(c.currentTime);n.g.gain.setValueAtTime(n.g.gain.value,c.currentTime);n.g.gain.linearRampToValueAtTime(0,c.currentTime+.6);setTimeout(()=>{n.src.forEach(x=>{try{x.stop()}catch(e){}})},700)}catch(e){}}
}
function thunder(near){if(!G.audioOn)return;const c=ctx();if(!c)return;try{const t0=c.currentTime,amp=near?1:.75;
  const cr=c.createBufferSource();cr.buffer=noiseBuf(c,.6);const cf=c.createBiquadFilter();cf.type='highpass';cf.frequency.value=900;const cg=c.createGain();cg.gain.setValueAtTime(.0001,t0);cg.gain.exponentialRampToValueAtTime(.35*amp,t0+.015);cg.gain.exponentialRampToValueAtTime(.0001,t0+.45);cr.connect(cf).connect(cg).connect(c.destination);cr.start(t0);cr.stop(t0+.6);
  const s=c.createBufferSource();s.buffer=noiseBuf(c,5);const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(260,t0);f.frequency.exponentialRampToValueAtTime(70,t0+4.5);const g=c.createGain();
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.9*amp,t0+.12);g.gain.exponentialRampToValueAtTime(.35*amp,t0+.9);g.gain.exponentialRampToValueAtTime(.6*amp,t0+1.4);g.gain.exponentialRampToValueAtTime(.2*amp,t0+2.6);g.gain.exponentialRampToValueAtTime(.0001,t0+4.8);
  s.connect(f).connect(g).connect(c.destination);s.start(t0);s.stop(t0+5)}catch(e){}buzz(near?[40,30,90]:60)}

    <p class="wl-pre">${G.lang==='id'?'Hujan sejak sore. Di peron 2 Stasiun Bogor, sebuah HP berdering tanpa pemilik.':'Rain since the afternoon. On platform 2 at Bogor Station, a phone keeps ringing with no owner.'}</p>

const IC_SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>';

function wakeSound(strike){if(!SAVE.sound)return;if(!ctx())return;const was=G.audioOn;G.audioOn=true;rainSound(true);if(strike||!was){setTimeout(()=>{fxStrikeNow()},strike?350:900)}}
function fxStrikeNow(){const w=FX.wrap;if(!w)return;const f=$('.fx-flash',w);if(f&&SAVE.fx){f.classList.remove('go');w.classList.remove('lit');void f.offsetWidth;f.classList.add('go');w.classList.add('lit')}setTimeout(()=>thunder(true),SAVE.fx?380:0)}
function enterHome(){ctx();G.audioOn=true;if(SAVE.sound)rainSound(true);showMenu();accPull()}
function nextStory(){
  if(!SAVE.best.prolog)return {id:'prolog',ey:["Mulai di sini","Start here"],cta:["Mulai Prolog","Start the Prologue"]};
  const nx=ORDER.find(id=>!SAVE.best[id]);
  if(nx)return {id:nx,ey:["Bab berikutnya","Next chapter"],cta:[`Mainkan ${LV[nx].no[0]}`,`Play ${LV[nx].no[1]}`]};
  const lo=ORDER.slice(1).find(id=>SAVE.best[id].stars<3);

  return {id:'bab5',ey:["Season 1 tamat","Season 1 complete"],cta:["Main Bab 5 lagi","Replay Chapter 5"]};

function showMenu(){
  G.scene='menu';stopPlay();

    <div class="hm-row"><button data-a="levels">${G.lang==='id'?'Semua bab':'All chapters'}</button><button data-a="howto">${esc(t(U.howto))}</button><button class="s2t" data-a="s2"><img src="${PHOTOS.wp_s2}" alt=""><span><small>${G.lang==='id'?'Segera':'Soon'}</small>Season 2</span></button></div>
    <p class="hm-foot">${esc(t(U.phones))}</p>
    <div class="hm-credits">${creditHtml()}${sawHtml()}</div>`,'menu');
  loadCfg();

  <div class="setrow"><span>${esc(t(U.lang))}</span><div class="seg"><button data-a="langM" data-v="id" aria-pressed="${G.lang==='id'}">Indonesia</button><button data-a="langM" data-v="en" aria-pressed="${G.lang==='en'}">English</button></div></div>

showWelcome();
